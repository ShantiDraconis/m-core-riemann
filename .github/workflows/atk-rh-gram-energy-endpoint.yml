name: atk-rh-gram-energy-endpoint

on:
  push:
    branches:
      - atk/rh-gram-energy-endpoint-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gram-energy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
      - name: Resolve pinned dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Source firewall
        run: |
          set -euo pipefail
          FILE=lean/MCore/RH/NB/GramEnergy.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder)([^[:alnum:]_]|$)' "$FILE"
          ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$FILE"
      - name: Build Gram energy endpoint
        run: |
          lake build MCore.RH.NB.GramEnergy
      - name: Theorem API
        run: |
          cat > RHGramEnergyAudit.lean <<'EOF'
          import MCore.RH.NB.GramEnergy
          #check MCore.RH.NB.NBHilbertData.coefficient_error_sq_eq_energy
          #check MCore.RH.NB.NBHilbertData.coefficientEnergy_of_normal_equations
          #check MCore.RH.NB.NBHilbertData.exists_optimal_coefficients_reduced_energy
          EOF
          lake env lean RHGramEnergyAudit.lean
      - name: Axiom audit
        run: |
          cat > RHGramEnergyAxioms.lean <<'EOF'
          import MCore.RH.NB.GramEnergy
          #print axioms MCore.RH.NB.NBHilbertData.coefficient_error_sq_eq_energy
          #print axioms MCore.RH.NB.NBHilbertData.coefficientEnergy_of_normal_equations
          #print axioms MCore.RH.NB.NBHilbertData.exists_optimal_coefficients_reduced_energy
          EOF
          lake env lean RHGramEnergyAxioms.lean | tee rh-gram-energy-axioms.txt
          ! grep -E 'sorryAx' rh-gram-energy-axioms.txt
