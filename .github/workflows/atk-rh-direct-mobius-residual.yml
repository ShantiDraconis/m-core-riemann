name: atk-rh-direct-mobius-residual

on:
  push:
    branches:
      - atk/rh-direct-mobius-residual-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-rh-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
      - name: Resolve pinned dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Source firewall
        run: |
          set -euo pipefail
          for FILE in             lean/MCore/RH/R2/MobiusDivisorKernel.lean             lean/MCore/RH/NB/CoefficientRealization.lean
          do
            ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder)([^[:alnum:]_]|$)' "$FILE"
            ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$FILE"
          done
      - name: Build direct kernels
        run: |
          lake build MCore.RH.R2.MobiusDivisorKernel
          lake build MCore.RH.NB.CoefficientRealization
      - name: Theorem API
        run: |
          cat > RHDirectKernelAudit.lean <<'EOF'
          import MCore.RH.R2.MobiusDivisorKernel
          import MCore.RH.NB.CoefficientRealization
          #check MCore.RH.R2.sum_moebius_divisors_eq_indicator
          #check MCore.RH.NB.NBHilbertData.exists_coefficients_of_mem_V
          #check MCore.RH.NB.NBHilbertData.dN_le_coefficient_error
          #check MCore.RH.NB.NBHilbertData.exists_optimal_coefficients_DN
          #check MCore.RH.NB.NBHilbertData.DN_le_coefficient_error_sq
          EOF
          lake env lean RHDirectKernelAudit.lean
      - name: Axiom audit
        run: |
          cat > RHDirectKernelAxioms.lean <<'EOF'
          import MCore.RH.R2.MobiusDivisorKernel
          import MCore.RH.NB.CoefficientRealization
          #print axioms MCore.RH.R2.sum_moebius_divisors_eq_indicator
          #print axioms MCore.RH.NB.NBHilbertData.exists_coefficients_of_mem_V
          #print axioms MCore.RH.NB.NBHilbertData.dN_le_coefficient_error
          #print axioms MCore.RH.NB.NBHilbertData.exists_optimal_coefficients
          #print axioms MCore.RH.NB.NBHilbertData.exists_optimal_coefficients_DN
          #print axioms MCore.RH.NB.NBHilbertData.DN_le_coefficient_error_sq
          EOF
          lake env lean RHDirectKernelAxioms.lean | tee rh-direct-kernel-axioms.txt
          ! grep -E 'sorryAx' rh-direct-kernel-axioms.txt
