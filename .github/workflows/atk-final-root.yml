name: ATK FINAL ROOT
on:
  push:
    branches: [atk/auto-compose-terminal-20260930]
    paths:
      - '.github/workflows/atk-final-root.yml'
      - 'lean/**'
  workflow_dispatch:
jobs:
  final-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build FINAL_ROOT
        run: lake build MCore.RH.R2.FinalExternal
