name: r2-formal-endpoint

on:
  push:
    branches:
      - research/r2-dnlimit-zero
    paths:
      - 'research/r2/BackwardDenseEndpoint.lean'
      - '.github/workflows/r2-formal-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Resolve pinned dependency closure
        run: |
          set -euo pipefail
          lake update

      - name: R2 source hygiene
        run: |
          set -euo pipefail
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' research/r2/BackwardDenseEndpoint.lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' research/r2/BackwardDenseEndpoint.lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi

      - name: Targeted R2 endpoint kernel check
        run: |
          set -euo pipefail
          lake env lean research/r2/BackwardDenseEndpoint.lean 2>&1 | tee R2BackwardDenseEndpoint.log

      - name: R2 non-promotion firewall
        run: |
          set -euo pipefail
          grep -F 'def MaterialFrontier : Prop := OpenBridge' research/r2/BackwardDenseEndpoint.lean
          grep -F 'def R1ExternalBridge : Prop :=' research/r2/BackwardDenseEndpoint.lean
          if grep -E 'theorem[[:space:]]+.*:[[:space:]]*FinalStatement[[:space:]]*:=' research/r2/BackwardDenseEndpoint.lean; then
            echo 'Unconditional final endpoint promotion detected'
            exit 1
          fi
