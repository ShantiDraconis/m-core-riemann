name: r0-4-chi-memlp

on:
  push:
    branches: [audit/r0-4-chi-memlp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r0-4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Lean toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
      - name: Resolve dependencies cleanly
        run: |
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Frozen R0.3 provenance gate
        run: |
          set -euo pipefail
          SHA=67c9055c6e0778d9e46abab211aafa569dfcc280
          git cat-file -e "$SHA^{commit}"
          grep -q "$SHA" audit/R0_4_ASSUMPTIONS.json
          test "$(git merge-base "$SHA" HEAD)" = "$SHA"
          git show "$SHA:lean/MCore/RH/R0/ChiL2.lean" >/dev/null
      - name: Source firewall
        run: |
          set -euo pipefail
          FILE=lean/MCore/RH/R0/ChiMemLp.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder)([^[:alnum:]_]|$)' "$FILE"
          ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$FILE"
          ! grep -n -E '(RiemannHypothesis|RH_PROVED|DNToZero|DNLimit[[:space:]]*=[[:space:]]*0)' "$FILE"
      - name: Build R0.4
        run: lake build MCore.RH.R0.ChiMemLp
      - name: Theorem API and axiom audit
        run: |
          cat > R04Audit.lean <<'EOF'
          import MCore.RH.R0.ChiMemLp
          open MCore.RH.R0 MeasureTheory
          #check chiRepresentative_norm_le_one
          #check chiRepresentative_measurable
          #check chiRepresentative_eq_indicator
          #check chiSupport_measure_ne_top
          #check chi_memLp_two
          #check chiLpConcrete
          #print axioms chiRepresentative_norm_le_one
          #print axioms chiRepresentative_measurable
          #print axioms chiRepresentative_eq_indicator
          #print axioms chiSupport_measure_ne_top
          #print axioms chi_memLp_two
          EOF
          lake env lean R04Audit.lean | tee r0-4-axioms.txt
          ! grep -E 'depends on axioms:.*sorryAx' r0-4-axioms.txt
      - name: Pointwise adversarial tests
        run: |
          cat > R04Pointwise.lean <<'EOF'
          import MCore.RH.R0.ChiMemLp
          open MCore.RH.R0
          example : chiRepresentative (1/2 : ℝ) = 1 := by norm_num [chiRepresentative]
          example : chiRepresentative (2 : ℝ) = 0 := by norm_num [chiRepresentative]
          example : chiRepresentative (0 : ℝ) = 0 := by norm_num [chiRepresentative]
          example : chiRepresentative (1 : ℝ) = 0 := by norm_num [chiRepresentative]
          example : ‖chiRepresentative (1/2 : ℝ)‖ ≤ 1 := chiRepresentative_norm_le_one _
          example : ‖chiRepresentative (2 : ℝ)‖ ≤ 1 := chiRepresentative_norm_le_one _
          EOF
          lake env lean R04Pointwise.lean
      - name: Semantic frontier firewall
        run: |
          set -euo pipefail
          FILE=lean/MCore/RH/R0/ChiMemLp.lean
          grep -q 'theorem chi_memLp_two : ChiMemLpTwo' "$FILE"
          grep -q 'noncomputable def chiLpConcrete' "$FILE"
          ! grep -n -E '(DNLimit|DNToZero|RiemannHypothesis|RH_PROVED)' "$FILE"
      - name: Assumptions firewall
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open('audit/R0_4_ASSUMPTIONS.json'))
          assert a['classification']=='CHI_MEMLP_TWO_PROVED'
          assert a['assumes']==[]
          assert a['consumes']['R0_3_SOURCE_SHA']=='67c9055c6e0778d9e46abab211aafa569dfcc280'
          names={x['name']:x['status'] for x in a['open_bridges']}
          assert set(names)=={'CHI_NORM_VALUE','RHO_DILATE_MEMLP_TWO','NB_HILBERT_IDENTIFICATION'}
          assert all(v=='OPEN_BRIDGE' for v in names.values())
          assert a['cross_repo_protocol']['search_before_new_math'] is True
          assert a['cross_repo_protocol']['analogy_only_is_proof_dependency'] is False
          assert a['dnlimit_eq_zero_proved'] is False
          assert a['rh_proved'] is False
          print('R0.4 assumptions firewall GREEN')
          PY
