name: nb-antitone

on:
  push:
    branches:
      - research/nb-antitone
  workflow_dispatch:

jobs:
  nb-antitone-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
      - name: Resolve dependencies
        run: |
          lake update
          lake exe cache get
      - name: NB13 source firewall
        run: |
          FILE=lean/MCore/RH/NB/Antitone.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder|TODO|FIXME)([^[:alnum:]_]|$)' "$FILE"
          ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$FILE"
      - name: NB13 build antitone
        run: lake build MCore.RH.NB.Antitone
      - name: NB13 theorem API
        run: |
          cat > NBAntitoneAudit.lean <<'EOF'
          import MCore.RH.NB.Antitone
          open MCore.RH.NB
          #check NBHilbertData.dN_antitone_of_le
          #check NBHilbertData.DN_antitone_of_le
          #check NBHilbertData.DN_antitone
          EOF
          lake env lean NBAntitoneAudit.lean
      - name: NB13 axiom report
        run: |
          cat > NBAntitoneAxioms.lean <<'EOF'
          import MCore.RH.NB.Antitone
          open MCore.RH.NB
          #print axioms NBHilbertData.dN_antitone_of_le
          #print axioms NBHilbertData.DN_antitone_of_le
          #print axioms NBHilbertData.DN_antitone
          EOF
          lake env lean NBAntitoneAxioms.lean | tee nb13-axioms.txt
          python3 - <<'PY'
          import re, sys
          text = open('nb13-axioms.txt', encoding='utf-8').read()
          lists = re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          if not lists:
              print('No axiom dependency report found', file=sys.stderr); sys.exit(1)
          bad = set()
          for body in lists:
              bad |= {x.strip() for x in body.split(',') if x.strip()} - allowed
          if bad:
              print('Unexpected axioms:', ', '.join(sorted(bad)), file=sys.stderr); sys.exit(1)
          print('NB13 axiom audit GREEN')
          PY
