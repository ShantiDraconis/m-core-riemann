name: atk-terminal-producer

on:
  push:
    branches: [atk/terminal-parameter-law-20261003]
    paths:
      - 'lean/MCore/RH/**'
      - 'audit/RHKernelAxiomAudit.lean'
      - 'audit/rh_preflight_kernel.sh'
      - 'audit/rh_terminal_kernel_check.sh'
      - '.github/workflows/atk-terminal-producer.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run full RH audit/root build'
        required: false
        default: false
        type: boolean

concurrency:
  group: rh-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rh-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Lean only
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Repair manifest
        run: |
          "$HOME/.elan/bin/lake" update

      - name: Restore Mathlib cache
        run: |
          "$HOME/.elan/bin/lake" exe cache get

      - name: G0 fast source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean/MCore/RH; then
            exit 1
          fi
          if grep -R -n -E '^[[:space:]]*(@\\[[^]]*\\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean/MCore/RH; then
            exit 1
          fi

      - name: Build active RH bundle plus changed modules
        shell: bash
        run: |
          set -euo pipefail
          MODULES=(
            MCore.RH.R0.ChiNorm
            MCore.RH.R0.ConcreteGramLogRate
            MCore.RH.R0.GramExplicit
            MCore.RH.R0.WeightedIntegrability
            MCore.RH.Analytic.MellinTarget
            MCore.RH.Analytic.MellinStripConvergence
            MCore.RH.Analytic.MellinRhoReduction
          )
          mapfile -t FILES < <(git diff --name-only HEAD^ HEAD -- 'lean/MCore/RH/**/*.lean')
          for f in "${FILES[@]}"; do
            module="${f#lean/}"
            module="${module%.lean}"
            module="${module//\//.}"
            MODULES+=("$module")
          done
          status=0
          while read -r module; do
            echo "=== FAST BUILD: $module ==="
            if lake build "$module"; then
              echo "FAST_BUILD_GREEN $module"
            else
              echo "FAST_BUILD_RED $module"
              status=1
            fi
          done < <(printf '%s\n' "${MODULES[@]}" | awk '!seen[$0]++')
          exit "$status"

      - name: Fast changed-file axiom scan
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git diff --name-only HEAD^ HEAD -- 'lean/MCore/RH/**/*.lean')
          for f in "${FILES[@]}"; do
            grep -nE '^[[:space:]]*#print axioms' "$f" || true
          done

  rh-full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean and repair manifest
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
          "$HOME/.elan/bin/lake" exe cache get

      - name: Full producer-first preflight
        run: bash audit/rh_terminal_kernel_check.sh

      - name: Full exact axiom audit
        run: |
          set -euo pipefail
          lake env lean audit/RHKernelAxiomAudit.lean 2>&1 | tee /tmp/rh-kernel-axioms.log
          ! grep -q 'sorryAx' /tmp/rh-kernel-axioms.log

      - name: Full terminal/root build
        run: |
          lake build MCore.RH.R0.RHKernelEntry
          lake build MCore

      - name: Frontier status
        run: |
          echo "RH_STRUCTURE=KERNEL_TESTED"
          echo "RH_OPEN_MATH=ConcreteUniformLogDNBound"
          echo "RH_PROOF=OPEN"
