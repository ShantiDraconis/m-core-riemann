name: nb-nesting

on:
  push:
    branches:
      - research/nb-nesting
  workflow_dispatch:

jobs:
  nb-nesting-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
      - name: Resolve dependencies
        run: |
          lake update
          lake exe cache get
      - name: NB12 source firewall
        run: |
          FILE=lean/MCore/RH/NB/Nesting.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder|TODO|FIXME)([^[:alnum:]_]|$)' "$FILE"
          ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$FILE"
      - name: NB12 build nesting
        run: lake build MCore.RH.NB.Nesting
      - name: NB12 theorem API
        run: |
          cat > NBNestingAudit.lean <<'EOF'
          import MCore.RH.NB.Nesting
          open MCore.RH.NB
          #check NBHilbertData.finiteGenerators_mono
          #check NBHilbertData.V_mono_of_le
          #check NBHilbertData.V_le_succ
          EOF
          lake env lean NBNestingAudit.lean
      - name: NB12 axiom report
        run: |
          cat > NBNestingAxioms.lean <<'EOF'
          import MCore.RH.NB.Nesting
          open MCore.RH.NB
          #print axioms NBHilbertData.finiteGenerators_mono
          #print axioms NBHilbertData.V_mono_of_le
          #print axioms NBHilbertData.V_le_succ
          EOF
          lake env lean NBNestingAxioms.lean | tee nb12-axioms.txt
          python3 - <<'PY'
          import re, sys
          text = open('nb12-axioms.txt', encoding='utf-8').read()
          lists = re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          if not lists:
              print('No axiom dependency report found', file=sys.stderr); sys.exit(1)
          bad = set()
          for body in lists:
              bad |= {x.strip() for x in body.split(',') if x.strip()} - allowed
          if bad:
              print('Unexpected axioms:', ', '.join(sorted(bad)), file=sys.stderr); sys.exit(1)
          print('NB12 axiom audit GREEN')
          PY
