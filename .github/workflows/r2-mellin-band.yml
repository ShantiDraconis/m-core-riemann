name: r2-mellin-band-diagnostic

on:
  push:
    branches:
      - research/r2-dnlimit-zero
    paths:
      - 'research/r2/mellin_band_probe.py'
      - '.github/workflows/r2-mellin-band.yml'
  workflow_dispatch:
    inputs:
      schedule:
        description: 'comma-separated N values'
        required: false
        default: '32,64,128,256'
      dps:
        description: 'mpmath decimal precision'
        required: false
        default: '40'

permissions:
  contents: read

jobs:
  mellin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned R2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/r2/requirements-r2.txt

      - name: Run Mellin frequency-band diagnostic
        env:
          SCHEDULE: ${{ github.event.inputs.schedule || '32,64,128,256' }}
          DPS: ${{ github.event.inputs.dps || '40' }}
        run: |
          python research/r2/mellin_band_probe.py \
            --schedule "$SCHEDULE" \
            --dps "$DPS" \
            --jsonl research/r2/mellin_band_probe.jsonl

      - name: Semantic firewall
        shell: python
        run: |
          import json
          rows=[]
          with open("research/r2/mellin_band_probe.jsonl", encoding="utf-8") as f:
              for line in f:
                  rows.append(json.loads(line))
          assert rows
          for r in rows:
              assert r["classification"] == "MODEL_EVIDENCE_ONLY_NUMERICAL_MELLIN_BANDS"
              assert r["dnlimit_eq_zero_proved"] is False
              assert r["rh_proved"] is False
              assert "not a certified tail bound" in r["remainder_interpretation"]
              frac=float(r["captured_fraction_of_reference"])
              assert 0.80 < frac < 1.10

      - uses: actions/upload-artifact@v4
        with:
          name: r2-mellin-band-${{ github.sha }}
          path: research/r2/mellin_band_probe.jsonl
          if-no-files-found: error

      - name: Research status
        run: |
          echo "MELLIN_BANDS=MODEL_EVIDENCE_ONLY"
          echo "TAIL_BOUND=OPEN_MATH"
          echo "UNIFORM_UPPER_BOUND=OPEN_MATH"
          echo "DNLIMIT_EQ_ZERO=false"
          echo "RH_PROVED=false"
