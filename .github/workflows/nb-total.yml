name: nb-total

on:
  push:
    branches: [audit/nb-total-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nb-total:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
      - name: Resolve dependencies from clean manifest
        run: |
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: NB TOTAL source firewall
        run: |
          set -euo pipefail
          FILE=lean/MCore/RH/NB/Total.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder)([^[:alnum:]_]|$)' "$FILE"
          ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$FILE"
          ! grep -n -E '(RiemannHypothesis|RH_PROVED|criterion_iff_RH)' "$FILE"
      - name: Build NB TOTAL
        run: lake build MCore.RH.NB.Total
      - name: NB TOTAL theorem API and axioms
        run: |
          cat > NBTotalAudit.lean <<'EOF'
          import MCore.RH.NB.Total
          open MCore.RH.NB
          #check NBHilbertData.delta
          #check NBHilbertData.delta_nonneg
          #check NBHilbertData.tendsto_DN_delta
          #check NBHilbertData.delta_eq_zero_iff_DNToZero
          #print axioms NBHilbertData.delta_nonneg
          #print axioms NBHilbertData.tendsto_DN_delta
          #print axioms NBHilbertData.delta_eq_zero_iff_DNToZero
          EOF
          lake env lean NBTotalAudit.lean | tee nb-total-axioms.txt
          python3 - <<'PY'
          import re, sys
          text=open('nb-total-axioms.txt',encoding='utf-8').read()
          lists=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',text)
          allowed={'propext','Classical.choice','Quot.sound'}
          if not lists:
              print('No axiom report found',file=sys.stderr); sys.exit(1)
          bad=set()
          for body in lists:
              bad |= {x.strip() for x in body.split(',') if x.strip()} - allowed
          if bad:
              print('Unexpected axioms:',sorted(bad),file=sys.stderr); sys.exit(1)
          print('NB TOTAL axiom audit GREEN')
          PY
      - name: Boundary assertion
        run: |
          grep -q 'delta_eq_zero_iff_DNToZero' lean/MCore/RH/NB/Total.lean
          ! grep -q 'theorem.*delta.*=.*0 := ' lean/MCore/RH/NB/Total.lean
          echo 'NB TOTAL boundary preserved: zero defect remains an unproved frontier.'
