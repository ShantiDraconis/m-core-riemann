name: RH Terminal Wheel
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get || true
      - name: Build terminal wheel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02TerminalWheel
      - name: Zero-hole wheel guard
        shell: bash
        run: |
          set -euo pipefail
          f=lean/MCore/RH/P02TerminalWheel.lean
          if grep -En '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' "$f"; then
            echo "proof hole found"
            exit 1
          fi
          grep -q 'criticalWheelTerminalClosure_iff_orbitCollapse' "$f"
          echo "RH_TERMINAL_WHEEL=KERNEL_CHECKED"
