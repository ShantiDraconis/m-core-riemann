name: certificate
on: [push, pull_request]
jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - {name: Preserve K3, run: 'lake build MCore.K3 && lake build MCore.Frontier.K3Gaps && lake build MCore.AttackDAG.K3AlgebraAttacks'}
      - {name: Preserve K4-K5, run: 'lake build MCore.K4 && lake build MCore.K5'}
      - {name: Build K6 dependency kernel, run: 'lake build MCore.K6'}
      - name: K6 semantic axiom closure
        run: |
          printf 'import MCore.K6\n#print axioms MCore.k6_source_open\n#print axioms MCore.k6_target_open\n#print axioms MCore.k6_target_not_certified\n' > K6AxiomAudit.lean
          lake env lean K6AxiomAudit.lean 2>&1 | tee K6AxiomAudit.log
          grep -F "'MCore.k6_source_open' does not depend on any axioms" K6AxiomAudit.log
          grep -F "'MCore.k6_target_open' does not depend on any axioms" K6AxiomAudit.log
          grep -F "'MCore.k6_target_not_certified' does not depend on any axioms" K6AxiomAudit.log
      - name: Backward endpoint-type firewall
        run: |
          set -euo pipefail
          lake build MCore.BackwardAudit.EndpointTypeResidue MCore.BackwardAudit.CrossProblemBridgeBoundary
          test ! -e lean/MCore/BackwardAudit/HypotheticalClosureOracle.lean
          lake env lean lean/MCore/BackwardAudit/EndpointTypeResidue.lean 2>&1 | tee BackwardEndpoint.log
          lake env lean lean/MCore/BackwardAudit/CrossProblemBridgeBoundary.lean 2>&1 | tee CrossProblemBridge.log
          if grep -E 'sorryAx' BackwardEndpoint.log CrossProblemBridge.log; then exit 1; fi
          grep -F "'MCore.BackwardAudit.endpoint_route_is_criticalLine' does not depend on any axioms" BackwardEndpoint.log
          grep -F "'MCore.BackwardAudit.endpoint_proposition_still_untyped' does not depend on any axioms" BackwardEndpoint.log
          grep -F "'MCore.BackwardAudit.cross_problem_endpoint_still_untyped' does not depend on any axioms" CrossProblemBridge.log
          grep -F "'MCore.BackwardAudit.rh_to_pnp_equality_if_bridge_supplied' does not depend on any axioms" CrossProblemBridge.log
          grep -F "'MCore.BackwardAudit.rh_to_pnp_separation_if_bridge_supplied' does not depend on any axioms" CrossProblemBridge.log
      - {name: Clean reproduction, run: 'lake clean && timeout 20m lake build MCore'}
