name: certificate
on:
  push:
    branches-ignore:
      - research/r2-dnlimit-zero
  pull_request:
jobs:
  k8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean for manifest repair
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Repair Lake manifest before cache restore
        run: |
          "$HOME/.elan/bin/lake" update
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: G1 preserve frozen K7
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/MCore/K7.lean)" = "abc1975c6de54eda03a5af2604490c1993fd5600"
          lake build MCore.K7
      - name: G2 explicit K8 build
        run: lake build MCore.K8
      - name: G3 exact RH endpoint API
        run: |
          cat > K8EndpointAudit.lean <<'EOF'
          import MCore.K8
          open MCore
          example : OfficialSpecRH = RiemannHypothesis := rfl
          example (h : RHAdapterObligations) : RiemannHypothesis := rh_endpoint_of_adapter h
          EOF
          lake env lean K8EndpointAudit.lean
      - name: G4 K8 semantic axiom closure
        run: |
          set -euo pipefail
          printf 'import MCore.K8\n#print axioms MCore.rh_endpoint_of_adapter\n#print axioms MCore.k8_preserves_k7_firewall\n#print axioms MCore.k8_k7_target_open\n' > K8AxiomAudit.lean
          lake env lean K8AxiomAudit.lean 2>&1 | tee K8AxiomAudit.log
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("K8AxiomAudit.log").read_text()
          if "sorryAx" in text:
              raise SystemExit("sorryAx present in K8 axiom footprint")

          expected = {
              "MCore.rh_endpoint_of_adapter": {"propext", "Classical.choice", "Quot.sound"},
              "MCore.k8_preserves_k7_firewall": set(),
              "MCore.k8_k7_target_open": set(),
          }

          for theorem, allowed in expected.items():
              noax = f"'{theorem}' does not depend on any axioms"
              if noax in text:
                  got = set()
              else:
                  m = re.search(
                      rf"'{re.escape(theorem)}' depends on axioms:\s*\[([^\]]*)\]",
                      text,
                  )
                  if not m:
                      raise SystemExit(f"missing #print axioms result for {theorem}")
                  got = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if got != allowed:
                  raise SystemExit(
                      f"unexpected axiom footprint for {theorem}: "
                      f"got={sorted(got)} expected={sorted(allowed)}"
                  )
          print("K8_AXIOM_FOOTPRINT=GREEN")
          PY
      - name: G5 structural K7 firewall remains valid
        run: |
          cat > K8FirewallAudit.lean <<'EOF'
          import MCore.K8
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k8_preserves_k7_firewall
          example : k6_dependency.target.status = .openBridge := k8_k7_target_open
          EOF
          lake env lean K8FirewallAudit.lean
      - name: G6 numerical evidence excluded from Lean proof chain
        run: |
          set -euo pipefail
          if grep -R -n -E 'phi_derived|0\.309|0\.594|0\.609' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: G7 clean K8 reproduction
        run: |
          lake clean
          lake build MCore.K3
          lake build MCore.K4
          lake build MCore.K5
          lake build MCore.K6
          lake build MCore.K7
          lake build MCore.K8
