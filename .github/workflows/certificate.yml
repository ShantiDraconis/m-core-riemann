name: certificate

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-k8-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Historical certificate notice
        run: |
          echo "Historical K8 certificate is manual-only on this RH branch."
          echo "Use RH Unified Final for the canonical branch gate."
