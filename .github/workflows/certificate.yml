name: certificate
on: [push, pull_request]
jobs:
  k8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Install Lean for manifest repair
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Repair Lake manifest
        run: "$HOME/.elan/bin/lake update"
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: G1 preserve frozen K7
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lean/MCore/K7.lean)" = "abc1975c6de54eda03a5af2604490c1993fd5600"
          lake build MCore.K7
      - name: G2 explicit K8 build
        run: lake build MCore.K8
      - name: G3 exact RH endpoint API
        run: |
          cat > K8EndpointAudit.lean <<'EOF'
          import MCore.K8
          open MCore
          example : OfficialSpecRH = RiemannHypothesis := rfl
          example (h : RHAdapterObligations) : RiemannHypothesis := rh_endpoint_of_adapter h
          EOF
          lake env lean K8EndpointAudit.lean
      - name: G4 K8 semantic axiom closure
        run: |
          printf 'import MCore.K8\n#print axioms MCore.rh_endpoint_of_adapter\n#print axioms MCore.k8_preserves_k7_firewall\n#print axioms MCore.k8_k7_target_open\n' > K8AxiomAudit.lean
          lake env lean K8AxiomAudit.lean 2>&1 | tee K8AxiomAudit.log
          grep -F "'MCore.rh_endpoint_of_adapter' depends on axioms: [propext, Classical.choice, Quot.sound]" K8AxiomAudit.log
          grep -F "'MCore.k8_preserves_k7_firewall' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.k8_k7_target_open' does not depend on any axioms" K8AxiomAudit.log
      - name: G5 structural K7 firewall remains valid
        run: |
          cat > K8FirewallAudit.lean <<'EOF'
          import MCore.K8
          open MCore
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := k8_preserves_k7_firewall
          example : k6_dependency.target.status = .openBridge := k8_k7_target_open
          EOF
          lake env lean K8FirewallAudit.lean
      - name: G6 numerical evidence excluded from K8 import closure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("lean")
          start = root / "MCore" / "K8.lean"
          banned = re.compile(r"phi_derived|0\.309|0\.594|0\.609")
          seen = set()
          stack = [start]
          hits = []
          while stack:
              path = stack.pop()
              path = path.resolve()
              if path in seen or not path.exists():
                  continue
              seen.add(path)
              text = path.read_text()
              for n, line in enumerate(text.splitlines(), 1):
                  if banned.search(line):
                      hits.append(f"{path.relative_to(pathlib.Path.cwd())}:{n}:{line}")
              for line in text.splitlines():
                  line = line.strip()
                  if not line.startswith("import "):
                      continue
                  mod = line.split(None, 1)[1].strip()
                  if not mod.startswith("MCore"):
                      continue
                  dep = root / (mod.replace(".", "/") + ".lean")
                  if dep.exists():
                      stack.append(dep)
          if hits:
              print("\n".join(hits))
              sys.exit(1)
          print(f"K8 local import closure clean: {len(seen)} modules")
          PY
      - name: G7 clean K8 reproduction
        run: |
          lake clean
          lake build MCore.K3
          lake build MCore.K4
          lake build MCore.K5
          lake build MCore.K6
          lake build MCore.K7
          lake build MCore.K8
