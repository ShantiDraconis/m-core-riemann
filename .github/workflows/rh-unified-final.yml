name: RH Unified Final
on:
  push:
    branches: [atk/terminal-parameter-law-20261003]
    paths:
      - 'lean/MCore/RH/**'
      - '.github/workflows/rh-unified-final.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unified-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
      - name: Build RH final chain
        run: |
          set -euo pipefail
          lake build MCore.RH.NB.ExactFinalProducer
          lake build MCore.RH.R0.ConcreteFinalProducer
          lake build MCore.RH.NB.ExplicitCoefficientProducer
          lake build MCore.RH.NB.CoefficientPythagoras
          lake build MCore.RH.NB.CoefficientGramEnergy
          lake build MCore.RH.R0.GramIntegral
          lake build MCore.RH.R0.ConcreteGramLogRate
          lake build MCore.RH.R0.ExplicitCoefficientLogRate
          lake build MCore.RH.R0.ForensicMaterialAssembly
          lake build MCore.RH.R0.TransformInfraWrappers
      - name: Axiom audit
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/RHUnifiedAudit.lean <<'EOF'
          import MCore.RH.NB.ExactFinalProducer
          import MCore.RH.R0.ConcreteFinalProducer
          import MCore.RH.NB.ExplicitCoefficientProducer
          import MCore.RH.NB.CoefficientPythagoras
          import MCore.RH.NB.CoefficientGramEnergy
          import MCore.RH.R0.GramIntegral
          import MCore.RH.R0.ConcreteGramLogRate
          import MCore.RH.R0.ExplicitCoefficientLogRate
          import MCore.RH.R0.ForensicMaterialAssembly
          import MCore.RH.R0.TransformInfraWrappers
          #print axioms MCore.RH.NB.NBHilbertData.DNLimit_eq_zero_of_coefficient_error_tendsto_zero
          #print axioms MCore.RH.NB.NBHilbertData.coefficient_error_sq_eq_DN_add_projection_gap
          #print axioms MCore.RH.NB.NBHilbertData.coefficient_distance_sq_eq_gramEnergy_difference
          #print axioms MCore.RH.R0.concreteTargetVector_eq_setIntegral
          #print axioms MCore.RH.R0.concreteGramMatrix_eq_setIntegral
          #print axioms MCore.RH.R0.ConcreteGramLogRate.toUniformLogDNBound
          #print axioms MCore.RH.R0.ConcreteCoefficientLogRate.toUniformLogDNBound
          #print axioms MCore.RH.R0.mellin_rhoRepresentativeC_zeta_formula
          #print axioms MCore.RH.R0.terminal_of_forensic_quantitative_fragment
          #print axioms MCore.RH.R0.infra_FinalKernelComposition_como_prova
          #print axioms MCore.RH.R0.materialClosurePackage_of_producer
          EOF
          lake env lean /tmp/RHUnifiedAudit.lean 2>&1 | tee rh-unified-final.log
          if grep -q 'sorryAx' rh-unified-final.log; then exit 1; fi
