name: RH Unified Final

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - atk/rh-rejection-zero-probe-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rh-unified-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get || true
      - name: Build structural chain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02DeterministicRejectionZero
          lake build MCore.RH.P02TerminalFrontier
          lake build MCore.RH.P02LastOpenMath
          lake build MCore.RH.P02FinalRoot
          lake build MCore.RH.P02FinalGlobal
          lake build MCore.RH.P02ExternalEndpoint
          lake build MCore.RH.P02TerminalWheel
          lake build MCore.RH.P02TerminalThreeWay
          lake build MCore.RH.P02OpenClosedDuality
          lake build MCore.RH.P02TerminalIdentityAudit
          lake build MCore.RH.P02TerminalTransition
      - name: Build RPA chain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02RPADualCertificate
          lake build MCore.RH.P02RPAEndpointLattice
      - name: Build critical reflection symmetry
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02CriticalReflectionSymmetry
      - name: Build material rigidity frontier
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02MaterialRigidityLaw
      - name: Build material payload
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02RiemannMaterialPayload
      - name: Zero-hole unified audit
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lean/MCore/RH/P02DeterministicRejectionZero.lean
            lean/MCore/RH/P02TerminalFrontier.lean
            lean/MCore/RH/P02LastOpenMath.lean
            lean/MCore/RH/P02FinalRoot.lean
            lean/MCore/RH/P02FinalGlobal.lean
            lean/MCore/RH/P02ExternalEndpoint.lean
            lean/MCore/RH/P02TerminalWheel.lean
            lean/MCore/RH/P02TerminalThreeWay.lean
            lean/MCore/RH/P02OpenClosedDuality.lean
            lean/MCore/RH/P02TerminalIdentityAudit.lean
            lean/MCore/RH/P02TerminalTransition.lean
            lean/MCore/RH/P02RPADualCertificate.lean
            lean/MCore/RH/P02RPAEndpointLattice.lean
            lean/MCore/RH/P02CriticalReflectionSymmetry.lean
            lean/MCore/RH/P02MaterialRigidityLaw.lean
            lean/MCore/RH/P02RiemannMaterialPayload.lean
          )
          for f in "${files[@]}"; do
            if grep -En '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' "$f"; then
              echo "proof hole found in $f"
              exit 1
            fi
          done
          grep -q 'criticalWheelTerminalClosure_iff_orbitCollapse' lean/MCore/RH/P02TerminalWheel.lean
          grep -q 'terminal_three_way_signature' lean/MCore/RH/P02TerminalThreeWay.lean
          grep -q 'rpa_endpoint_positions_distinct' lean/MCore/RH/P02RPADualCertificate.lean
          grep -q 'rpa_certificate_iff_dual_endpoint_state' lean/MCore/RH/P02RPADualCertificate.lean
          grep -q 'rpa_certificate_requires_open' lean/MCore/RH/P02RPADualCertificate.lean
          grep -q 'rpa_certificate_requires_closed' lean/MCore/RH/P02RPADualCertificate.lean
          grep -q 'complete_lattice_14' lean/MCore/RH/P02RPAEndpointLattice.lean
          grep -q 'raw_full_2_2' lean/MCore/RH/P02RPAEndpointLattice.lean
          grep -q 'full_raw_2_2_is_global_external' lean/MCore/RH/P02RPAEndpointLattice.lean
          grep -q 'criticalReflect_eq_star_functionalReflect' lean/MCore/RH/P02CriticalReflectionSymmetry.lean
          grep -q 'criticalReflect_zeta_zero_of_symmetries' lean/MCore/RH/P02CriticalReflectionSymmetry.lean
          grep -q 'theorem GammaR_star' lean/MCore/RH/P02CriticalReflectionSymmetry.lean
          grep -q 'def CompletedRiemannZetaConjugationSymmetry' lean/MCore/RH/P02CriticalReflectionSymmetry.lean
          grep -q 'riemannZetaConjugationZeroSymmetry_of_completed' lean/MCore/RH/P02CriticalReflectionSymmetry.lean
          grep -q 'structure RHMaterialRigidityCertificate' lean/MCore/RH/P02MaterialRigidityLaw.lean
          grep -q 'criticalReflectionZeroClosure_proved' lean/MCore/RH/P02MaterialRigidityLaw.lean
          grep -q 'structure RHMaterialPromotionInput' lean/MCore/RH/P02MaterialRigidityLaw.lean
          grep -q 'promotionInput_iff_offLineReflectedPairExclusion' lean/MCore/RH/P02MaterialRigidityLaw.lean
          grep -q 'criticalOrbitCollapse_of_material_rigidity' lean/MCore/RH/P02MaterialRigidityLaw.lean
          grep -q 'probeCriticalLine_of_material_rigidity' lean/MCore/RH/P02MaterialRigidityLaw.lean
          grep -q 'OffLineReflectedPairExclusion' lean/MCore/RH/P02MaterialRigidityLaw.lean
          grep -q 'structure RiemannMaterialPayload' lean/MCore/RH/P02RiemannMaterialPayload.lean
          grep -q 'materialWitnessOfRigidity' lean/MCore/RH/P02RiemannMaterialPayload.lean
          grep -q 'structure RHMaterialPromotion' lean/MCore/RH/P02RiemannMaterialPayload.lean
          grep -q 'def promotedByMaterial' lean/MCore/RH/P02RiemannMaterialPayload.lean
          grep -q 'materialPromotion_iff_offLineReflectedPairExclusion' lean/MCore/RH/P02RiemannMaterialPayload.lean
          grep -q 'payload_iff_endpoint' lean/MCore/RH/P02RiemannMaterialPayload.lean
          grep -q 'finalCertificate_iff_materialRH' lean/MCore/RH/P02RiemannMaterialPayload.lean
          grep -q 'finalCertificate_iff_endpoint' lean/MCore/RH/P02RiemannMaterialPayload.lean
          grep -q 'material_gate_exact' lean/MCore/RH/P02RiemannMaterialPayload.lean
          grep -q 'unprovenTerminal' lean/MCore/RH/P02LastOpenMath.lean
          grep -q 'RHSearchTraversalClosed' lean/MCore/RH/P02LastOpenMath.lean
          echo "RH_STRUCTURE=KERNEL_CHECKED"
          echo "RPA_LATTICE_14=KERNEL_CHECKED"
          echo "CRITICAL_REFLECTION_SYMMETRY=KERNEL_CHECKED"
          echo "MATERIAL_RIGIDITY_FRONTIER=KERNEL_CHECKED"
          echo "GLOBAL_EXTERNAL_STRUCTURE=KERNEL_CHECKED"
          echo "MATERIAL_PROMOTION_STRUCTURE=KERNEL_CHECKED"
          echo "MATERIAL_ENDPOINT_INHABITANT=AWAITING_OffLineReflectedPairExclusion"
          echo "REMAINING_MATERIAL_LAW=OffLineReflectedPairExclusion"
          echo "RH_UNIFIED_FINAL=KERNEL_CHECKED"
