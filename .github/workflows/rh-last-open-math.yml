name: RH Terminal Truncation
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-truncation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get || true
      - name: Build terminal target
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02LastOpenMath
      - name: Assert zero proof holes
        shell: bash
        run: |
          set -euo pipefail
          target=lean/MCore/RH/P02LastOpenMath.lean
          if grep -En '(^|[^A-Za-z])(sorry|admit|sorryAx|axiom)([^A-Za-z]|$)' "$target"; then
            echo "Forbidden proof hole/axiom in $target"
            exit 1
          fi
          grep -q 'unprovenTerminal' "$target"
          grep -q 'RHSearchTraversalClosed' "$target"
          echo "RH_TERMINAL_FILE_HOLES=0"
          echo "RH_SEARCH_TRAVERSAL=CLOSED"
          echo "RH_MATHEMATICAL_TERMINAL=UNPROVEN"
