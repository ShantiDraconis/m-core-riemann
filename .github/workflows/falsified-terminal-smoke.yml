name: FALSIFIED terminal smoke
on:
  push:
    branches: [atk/falsified-terminal-inhabitants-20260930]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  falsified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Compile deliberately falsified terminal
        run: |
          set -euo pipefail
          lake build MCore.RH.NB.FalsifiedTerminal 2>&1 | tee /tmp/falsified.log
          grep -F 'falsified_DNLimit_eq_zero' /tmp/falsified.log
          echo 'FALSIFIED_GREEN=1'
