name: r0-rho-concrete
on:
  push:
    branches: [audit/r0-4-chi-memlp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Build concrete rho interface
        run: lake build MCore.RH.R0.RhoConcrete
      - name: Axiom audit
        run: |
          cat > RhoAxiomAudit.lean <<'EOF'
          import MCore.RH.R0.RhoConcrete
          #print axioms MCore.RH.R0.rhoRepresentative_measurable
          #print axioms MCore.RH.R0.rhoRepresentative_nonneg
          #print axioms MCore.RH.R0.rhoRepresentative_lt_one
          #print axioms MCore.RH.R0.abs_rhoRepresentative_le_one
          #print axioms MCore.RH.R0.rhoRepresentative_zero
          EOF
          lake env lean RhoAxiomAudit.lean 2>&1 | tee RhoAxiomAudit.log
          ! grep -E 'sorryAx' RhoAxiomAudit.log
      - name: Pointwise adversarial tests
        run: |
          cat > RhoPointwiseAudit.lean <<'EOF'
          import MCore.RH.R0.RhoConcrete
          open MCore.RH.R0
          example (x : BaseDomain) : rhoRepresentative 0 x = 0 := by simp
          example (x : BaseDomain) : 0 ≤ rhoRepresentative 1 x := rhoRepresentative_nonneg 1 x
          example (x : BaseDomain) : rhoRepresentative 2 x < 1 := rhoRepresentative_lt_one 2 x
          example (x : BaseDomain) : |rhoRepresentative 1 x| ≤ 1 := abs_rhoRepresentative_le_one 1 x
          EOF
          lake env lean RhoPointwiseAudit.lean
      - name: Semantic firewall
        run: |
          set -euo pipefail
          ! grep -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/RH/R0/RhoConcrete.lean
          ! grep -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/RH/R0/RhoConcrete.lean
          ! grep -E 'RiemannHypothesis|RH_PROVED|DNLimit' lean/MCore/RH/R0/RhoConcrete.lean
