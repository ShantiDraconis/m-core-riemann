name: nb-hilbert

on:
  push:
    branches: ["research/nb-hilbert-layer"]
  workflow_dispatch:

jobs:
  nb-hilbert-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: NB7 source firewall
        run: |
          set -euo pipefail
          F=lean/MCore/RH/NB/HilbertData.lean
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder|TODO|FIXME)([^[:alnum:]_]|$)' "$F"; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$F"; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: NB7 build Hilbert foundation
        run: lake build MCore.RH.NB.HilbertData
      - name: NB7 theorem API
        run: |
          cat > NBHilbertAudit.lean <<'EOF'
          import MCore.RH.NB.HilbertData
          open MCore.RH.NB
          example (D : NBHilbertData) (rho : D.GeneratorFamily) (N : ℕ) (n : Fin N) :
              rho n ∈ D.V rho N := D.generator_mem_V rho N n
          example (D : NBHilbertData) (rho : D.GeneratorFamily) (N : ℕ) :
              (D.finiteGenerators rho N).Finite := D.finite_finiteGenerators rho N
          EOF
          lake env lean NBHilbertAudit.lean
      - name: NB7 axiom report
        run: |
          printf 'import MCore.RH.NB.HilbertData\n#print axioms MCore.RH.NB.NBHilbertData.generator_mem_V\n#print axioms MCore.RH.NB.NBHilbertData.finite_finiteGenerators\n' > NBHilbertAxioms.lean
          lake env lean NBHilbertAxioms.lean 2>&1 | tee NBHilbertAxioms.log
          if grep -E 'depends on axioms:.*MCore|depends on axioms:.*RH\.NB' NBHilbertAxioms.log; then exit 1; fi
