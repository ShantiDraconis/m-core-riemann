name: RH Terminal Three Way

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-three-way:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get || true
      - name: Build terminal wheel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02TerminalWheel
      - name: Build terminal three-way
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02TerminalThreeWay
      - name: Zero-hole guard
        shell: bash
        run: |
          set -euo pipefail
          for f in lean/MCore/RH/P02TerminalWheel.lean lean/MCore/RH/P02TerminalThreeWay.lean; do
            if grep -En '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' "$f"; then
              echo "proof hole found in $f"
              exit 1
            fi
          done
          echo "RH_TERMINAL_THREE_WAY=KERNEL_CHECKED"
