name: rh-terminal-kernel-pr

on:
  pull_request:
    branches:
      - main

concurrency:
  group: rh-terminal-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rh-terminal-kernel:
    if: github.head_ref == 'atk/terminal-parameter-law-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Repair Lake manifest
        run: |
          "$HOME/.elan/bin/lake" update
      - uses: leanprover/lean-action@v1
      - name: RH producer-first kernel
        run: |
          set -euo pipefail
          bash audit/rh_terminal_kernel_check.sh
      - name: RH exact axiom audit
        run: |
          set -euo pipefail
          lake env lean audit/RHKernelAxiomAudit.lean 2>&1 | tee RHKernelAxiomAudit.log
          if grep -q "sorryAx" RHKernelAxiomAudit.log; then
            echo "RH_KERNEL_AXIOM_AUDIT=RED_sorryAx"
            exit 1
          fi
          echo "RH_KERNEL_AXIOM_AUDIT=PASS"
      - name: RH status
        run: |
          echo "RH_PREFIX=KERNEL_TESTED"
          echo "RH_OPEN_MATH=Nonempty ConcreteVanishingUpperBound"
