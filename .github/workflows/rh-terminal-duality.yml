name: RH Terminal Duality

on:
  push:
    branches:
      - atk/rh-rejection-zero-probe-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-duality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get || true
      - name: Build terminal duality chain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02TerminalWheel
          lake build MCore.RH.P02TerminalThreeWay
          lake build MCore.RH.P02OpenClosedDuality
          lake build MCore.RH.P02TerminalIdentityAudit
      - name: Zero-hole guard
        shell: bash
        run: |
          set -euo pipefail
          for f in             lean/MCore/RH/P02TerminalWheel.lean             lean/MCore/RH/P02TerminalThreeWay.lean             lean/MCore/RH/P02OpenClosedDuality.lean \
            lean/MCore/RH/P02TerminalIdentityAudit.lean; do
            if grep -En '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' "$f"; then
              echo "proof hole found in $f"
              exit 1
            fi
          done
          echo "RH_TERMINAL_DUALITY=KERNEL_CHECKED"
