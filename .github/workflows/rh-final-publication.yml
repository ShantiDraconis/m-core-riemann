name: RH Final Publication Gate

on:
  push:
    branches:
      - atk/rh-rejection-zero-probe-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get || true
      - name: Build terminal chain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.RH.P02TerminalFrontier
          lake build MCore.RH.P02FinalRoot
          lake build MCore.RH.P02FinalGlobal
          lake build MCore.RH.P02ExternalEndpoint
      - name: Zero-hole publication wrappers
        shell: bash
        run: |
          set -euo pipefail
          for f in             lean/MCore/RH/P02TerminalFrontier.lean             lean/MCore/RH/P02FinalRoot.lean             lean/MCore/RH/P02FinalGlobal.lean             lean/MCore/RH/P02ExternalEndpoint.lean; do
            if grep -En '(^|[^A-Za-z])(sorry|admit|sorryAx|axiom)([^A-Za-z]|$)' "$f"; then
              echo "Forbidden proof hole/axiom in $f"
              exit 1
            fi
          done
      - name: Assert terminal truncation semantics
        shell: bash
        run: |
          set -euo pipefail
          f=lean/MCore/RH/P02LastOpenMath.lean
          if grep -En '(^|[^A-Za-z])(sorry|admit|sorryAx|axiom)([^A-Za-z]|$)' "$f"; then
            echo "Forbidden proof hole/axiom in $f"
            exit 1
          fi
          grep -q 'unprovenTerminal' "$f"
          grep -q 'RHSearchTraversalClosed' "$f"
          echo "FINAL_CODE_HOLES=0"
          echo "SEARCH_BRIDGE=CLOSED"
          echo "TERMINAL_RH_STATEMENT=UNPROVEN"
