name: ATK terminal auto-compose
on:
  push:
    branches: [atk/auto-compose-terminal-20260930]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Minimal proof escape guard
        run: |
          set -euo pipefail
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)[[:space:]]' lean/MCore/AutoCompose.lean
      - name: Build composition layer
        run: lake env lean lean/MCore/AutoCompose.lean
      - name: Build current terminal frontier only
        run: lake env lean lean/MCore/RH/NB/ZeroLimitFrontier.lean
