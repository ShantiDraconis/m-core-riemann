name: nb16-chain-audit

on:
  push:
    branches: [audit/nb16-chain-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nb16-chain-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"

      - name: Resolve dependencies from clean manifest
        run: |
          rm -f lake-manifest.json
          lake update
          lake exe cache get

      - name: NB16 source firewall
        run: |
          set -euo pipefail
          FILES=(
            lean/MCore/RH/NB/A14NonImplication.lean
            lean/MCore/RH/NB/FunctionalLawLogic.lean
            lean/MCore/RH/NB/FunctionalInterface.lean
            lean/MCore/RH/NB/HilbertData.lean
            lean/MCore/RH/NB/FiniteSpan.lean
            lean/MCore/RH/NB/Projection.lean
            lean/MCore/RH/NB/Distance.lean
            lean/MCore/RH/NB/Nesting.lean
            lean/MCore/RH/NB/Antitone.lean
            lean/MCore/RH/NB/Limit.lean
            lean/MCore/RH/NB/ZeroLimitFrontier.lean
          )
          for FILE in "${FILES[@]}"; do
            test -f "$FILE"
            ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder)([^[:alnum:]_]|$)' "$FILE"
            ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$FILE"
          done

      - name: NB16 semantic frontier firewall
        run: |
          set -euo pipefail
          FILE=lean/MCore/RH/NB/ZeroLimitFrontier.lean
          ! grep -n -E 'theorem[[:space:]].*(RH|Riemann)' "$FILE"
          ! grep -n -E '(RH_PROVED|RiemannHypothesis|criterion_iff_RH)' "$FILE"
          grep -n 'DNToZero_iff_DNLimit_eq_zero' "$FILE"

      - name: NB16 import DAG audit
        run: |
          set -euo pipefail
          grep -q '^import MCore.RH.NB.HilbertData' lean/MCore/RH/NB/FiniteSpan.lean
          grep -q '^import MCore.RH.NB.FiniteSpan' lean/MCore/RH/NB/Projection.lean
          grep -q '^import MCore.RH.NB.Projection' lean/MCore/RH/NB/Distance.lean
          grep -q '^import MCore.RH.NB.Distance' lean/MCore/RH/NB/Nesting.lean
          grep -q '^import MCore.RH.NB.Nesting' lean/MCore/RH/NB/Antitone.lean
          grep -q '^import MCore.RH.NB.Antitone' lean/MCore/RH/NB/Limit.lean
          grep -q '^import MCore.RH.NB.Limit' lean/MCore/RH/NB/ZeroLimitFrontier.lean
          test "$(grep -R -l -E '^[[:space:]]*chi[[:space:]]*:' lean/MCore/RH/NB/*.lean | wc -l)" -eq 1
          grep -q 'chi : H' lean/MCore/RH/NB/HilbertData.lean

      - name: NB16 build complete NB modules
        run: |
          lake build MCore.RH.NB.A14NonImplication
          lake build MCore.RH.NB.FunctionalLawLogic
          lake build MCore.RH.NB.FunctionalInterface
          lake build MCore.RH.NB.HilbertData
          lake build MCore.RH.NB.FiniteSpan
          lake build MCore.RH.NB.Projection
          lake build MCore.RH.NB.Distance
          lake build MCore.RH.NB.Nesting
          lake build MCore.RH.NB.Antitone
          lake build MCore.RH.NB.Limit
          lake build MCore.RH.NB.ZeroLimitFrontier

      - name: NB16 theorem API
        run: |
          cat > NB16Audit.lean <<'EOF'
          import MCore.RH.NB.ZeroLimitFrontier
          import MCore.RH.NB.FunctionalInterface
          import MCore.RH.NB.FunctionalLawLogic
          open MCore.RH.NB
          #check NBHilbertData.GeneratorFamily
          #check NBHilbertData.V
          #check NBHilbertData.P
          #check NBHilbertData.dN
          #check NBHilbertData.DN
          #check NBHilbertData.DN_antitone
          #check NBHilbertData.DNLimit
          #check NBHilbertData.tendsto_DN_DNLimit
          #check NBHilbertData.DNLimit_nonneg
          #check NBHilbertData.DNToZero
          #check NBHilbertData.DNToZero_iff_DNLimit_eq_zero
          #check NBHilbertData.DNToZero_of_le_zero
          EOF
          lake env lean NB16Audit.lean

      - name: NB16 axiom report
        run: |
          cat > NB16Axioms.lean <<'EOF'
          import MCore.RH.NB.ZeroLimitFrontier
          open MCore.RH.NB
          #print axioms NBHilbertData.generator_mem_V
          #print axioms NBHilbertData.finiteDimensional_V
          #print axioms NBHilbertData.P_minimal
          #print axioms NBHilbertData.DN_nonneg
          #print axioms NBHilbertData.DN_antitone
          #print axioms NBHilbertData.tendsto_DN_DNLimit
          #print axioms NBHilbertData.DNLimit_nonneg
          #print axioms NBHilbertData.DNToZero_iff_DNLimit_eq_zero
          #print axioms NBHilbertData.DNToZero_of_le_zero
          EOF
          lake env lean NB16Axioms.lean | tee nb16-axioms.txt
          python3 - <<'PY'
          import re, sys
          text=open('nb16-axioms.txt',encoding='utf-8').read()
          lists=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',text)
          allowed={'propext','Classical.choice','Quot.sound'}
          if not lists:
              print('No axiom dependency report found',file=sys.stderr); sys.exit(1)
          bad=set()
          for body in lists:
              bad |= {x.strip() for x in body.split(',') if x.strip()} - allowed
          if bad:
              print('Unexpected axioms:',', '.join(sorted(bad)),file=sys.stderr); sys.exit(1)
          print('NB16 axiom audit GREEN')
          PY

      - name: NB16 documentary evidence inventory
        run: |
          set -euo pipefail
          printf '%s\n' \
            'NB0-NB6 source=53b69c4169819fdb34154dce88ae0ef7baa1f75d run=35100985360 job=104810059794' \
            'NB7 source=c4fb586bd1db7eb1db7a66c43a52101f731dc534 run=35117492298' \
            'NB8 source=40b45b6aa73924249e4ad5ae457adcdf6419842a run=35123136016 job=104885590115' \
            'NB9 source=49c511f626b746ce52c6d3718350d02b1bfd4378 run=35126651841 job=104897232047' \
            'NB10-NB11 source=5ed1df6fae9ce82363f4221f91e7d20574dc5afe run=35127643964' \
            'NB12 source=7c2d8d3ef4ca96cde6a2ba80b456d4902ecb9b41 run=35129539470 job=104906808598' \
            'NB13 source=b2ef9ba5ee30de05af98ab3d58979691254ab9cb run=35144382612 job=104956605192' \
            'NB14 source=9d6c36dd9d7503e99edfc9fce4940665c95fad91 run=35146032014 job=104962225538' \
            'NB15 source=e7e36d636a56ea23fbf7b534acb4eecba76bc6b6 run=35147964804 job=104968746422' \
            | tee nb16-evidence.txt
          grep -q 'NB15 source=e7e36d636a56ea23fbf7b534acb4eecba76bc6b6' nb16-evidence.txt
