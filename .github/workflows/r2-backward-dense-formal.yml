name: r2-backward-dense-formal

on:
  push:
    branches:
      - research/r2-dnlimit-zero
    paths:
      - 'research/r2/BackwardDenseEndpoint.lean'
      - 'research/r2/backward_dense_audit.py'
      - 'audit/R2_ROUTE_MATRIX.json'
      - '.github/workflows/r2-backward-dense-formal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense-formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"

      - name: Resolve pinned dependencies
        run: |
          lake exe cache get

      - name: Compile backward-dense endpoint
        run: |
          lake env lean research/r2/BackwardDenseEndpoint.lean | tee r2-endpoint-axioms.txt

      - name: Endpoint source firewall
        run: |
          set -euo pipefail
          F=research/r2/BackwardDenseEndpoint.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder)([^[:alnum:]_]|$)' "$F"
          ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$F"
          grep -q 'def FinalStatement : Prop' "$F"
          grep -q 'def OpenBridge : Prop' "$F"
          grep -q 'theorem openBridge_iff_finalStatement' "$F"

      - name: Axiom audit
        run: |
          set -euo pipefail
          ! grep -E 'depends on axioms:.*sorryAx' r2-endpoint-axioms.txt
          ! grep -E 'depends on axioms:.*MCore' r2-endpoint-axioms.txt

      - name: Dense all-file audit
        run: python research/r2/backward_dense_audit.py

      - name: Semantic frontier check
        shell: python
        run: |
          import json
          r=json.load(open("audit/R2_ROUTE_MATRIX.json", encoding="utf-8"))
          assert r["status"] == "OPEN_BRIDGE"
          assert r["dnlimit_eq_zero_proved"] is False
          assert r["rh_proved"] is False
          nxt=r["next_mathematical_task"]
          assert nxt["canonical_mathematical_target"] == "BN_COMBINED_BLOCK_UNCONDITIONAL_CONTROL"
          assert nxt["status"] == "OPEN_MATH"
          assert nxt["minimal_gate_count"] == 1

      - name: Backward-dense status
        run: |
          echo "FINAL_STATEMENT=DEFINED_NOT_PROVED"
          echo "OPEN_BRIDGE=DNToZero"
          echo "OPEN_BRIDGE_IFF_FINAL=PROVED_LEAN_WIRING"
          echo "MATERIAL_FRONTIER=BN_COMBINED_BLOCK_UNCONDITIONAL_CONTROL"
          echo "MATERIAL_GATE_COUNT=1"
          echo "DNLimit_EQ_ZERO=false"
          echo "RH_PROVED=false"
