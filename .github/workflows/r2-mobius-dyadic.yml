name: r2-mobius-dyadic-diagnostic

on:
  push:
    branches:
      - research/r2-dnlimit-zero
    paths:
      - 'research/r2/gram_engine.py'
      - '.github/workflows/r2-mobius-dyadic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dyadic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned R2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/r2/requirements-r2.txt

      - name: Validate Arb backend
        run: python research/r2/probe_arb.py

      - name: Run interval-certified dyadic ladder
        run: |
          python research/r2/gram_engine.py \
            --backend arb \
            --schedule '32,64,128,256' \
            --dps 140 \
            --jsonl research/r2/mobius_dyadic_arb.jsonl

      - name: Extract best exponent at each N
        shell: python
        run: |
          import json

          rows=[]
          with open("research/r2/mobius_dyadic_arb.jsonl", encoding="utf-8") as f:
              for line in f:
                  r=json.loads(line)
                  scan=r["scaled_mobius_dyadic_scan_m_over_16"]
                  best=min(
                      scan.values(),
                      key=lambda x: float(x["optimized_squared_error"]["upper"])
                  )
                  row={
                      "N":r["N"],
                      "optimal_DN":r["DN"],
                      "best_alpha_num":best["alpha_num"],
                      "best_alpha_den":best["alpha_den"],
                      "best_scaled_mobius_error_sq":best["optimized_squared_error"],
                      "best_scale":best["optimal_scale"],
                      "classification":"INTERVAL_CERTIFIED_FINITE_N_MODEL_EVIDENCE",
                      "dnlimit_eq_zero_proved":False,
                      "rh_proved":False,
                  }
                  rows.append(row)
                  print(json.dumps(row, sort_keys=True))

          with open("research/r2/mobius_dyadic_summary.json", "w", encoding="utf-8") as f:
              json.dump(rows, f, indent=2, sort_keys=True)
              f.write("\n")

          assert all(r["dnlimit_eq_zero_proved"] is False for r in rows)
          assert all(r["rh_proved"] is False for r in rows)

      - uses: actions/upload-artifact@v4
        with:
          name: r2-mobius-dyadic-${{ github.sha }}
          path: |
            research/r2/mobius_dyadic_arb.jsonl
            research/r2/mobius_dyadic_summary.json
          if-no-files-found: error

      - name: Research status
        run: |
          echo "MOBIUS_DYADIC_SCAN=INTERVAL_CERTIFIED_FINITE_N"
          echo "UNIFORM_UPPER_BOUND=OPEN_MATH"
          echo "DNLIMIT_EQ_ZERO=false"
          echo "RH_PROVED=false"
