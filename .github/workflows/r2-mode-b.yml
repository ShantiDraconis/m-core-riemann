name: r2-mode-b-mellin-qr

on:
  push:
    branches:
      - research/r2-dnlimit-zero
    paths:
      - 'research/r2/mode_b_mellin_qr.py'
      - '.github/workflows/r2-mode-b.yml'
  workflow_dispatch:
    inputs:
      schedule:
        description: 'comma-separated N values'
        required: false
        default: '8,16,32,64,128,256'
      T_train:
        description: 'positive Mellin training window'
        required: false
        default: '250'
      samples_per_period:
        description: 'samples per shortest Dirichlet phase period'
        required: false
        default: '8'
      zeta_dps:
        description: 'mpmath precision used for zeta samples'
        required: false
        default: '50'
      arb_dps:
        description: 'Arb precision for exact finite candidate evaluation'
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  mode-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned R2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/r2/requirements-r2.txt

      - name: Run resolved Mellin QR Mode B v2 and BCF mollifier
        env:
          SCHEDULE: ${{ github.event.inputs.schedule || '8,16,32,64,128,256' }}
          T_TRAIN: ${{ github.event.inputs.T_train || '250' }}
          SAMPLES_PER_PERIOD: ${{ github.event.inputs.samples_per_period || '8' }}
          ZETA_DPS: ${{ github.event.inputs.zeta_dps || '50' }}
          ARB_DPS: ${{ github.event.inputs.arb_dps || '100' }}
        run: |
          python research/r2/mode_b_mellin_qr.py \
            --schedule "$SCHEDULE" \
            --T-train "$T_TRAIN" \
            --samples-per-period "$SAMPLES_PER_PERIOD" \
            --zeta-dps "$ZETA_DPS" \
            --arb-dps "$ARB_DPS" \
            --jsonl research/r2/mode_b_mellin_qr.jsonl

      - name: Semantic and solver firewall
        shell: python
        run: |
          import json
          with open("research/r2/mode_b_mellin_qr.jsonl", encoding="utf-8") as f:
              rows=[json.loads(line) for line in f if line.strip()]
          assert rows
          assert rows[-1]["N"] == 256
          for r in rows:
              assert r["classification"] == "MODE_B_V2_HOLDOUT_QR_FINITE_N_RESEARCH"
              assert r["uses_gram_inverse_for_coefficients"] is False
              assert r["scope"]["window_tail_certified"] is False
              assert r["dnlimit_eq_zero_proved"] is False
              assert r["rh_proved"] is False
              assert r["selected"]["selection_rule"] == "minimum independent validation-window energy"
              lo=float(r["selected"]["arb_full_finite_gram_E2"]["lower"])
              hi=float(r["selected"]["arb_full_finite_gram_E2"]["upper"])
              ref=float(r["selected"]["mode_A_optimal_DN_reference"])
              assert lo >= ref - 1e-10
              assert hi < 1.0
              blo=float(r["bcf_linear_mollifier"]["arb_full_finite_gram_E2"]["lower"])
              bhi=float(r["bcf_linear_mollifier"]["arb_full_finite_gram_E2"]["upper"])
              assert blo >= ref - 1e-10
              assert bhi < 1.0

      - uses: actions/upload-artifact@v4
        with:
          name: r2-mode-b-${{ github.sha }}
          path: research/r2/mode_b_mellin_qr.jsonl
          if-no-files-found: error

      - name: R2 Mode B status
        run: |
          echo "MODE_B_V2=FINITE_N_TESTED"
          echo "BCF_LINEAR_MOLLIFIER=FINITE_N_TESTED"
          echo "WINDOW_TAIL=UNPROVED_NOT_USED_FOR_PROMOTION"
          echo "ZERO_RESIDUE_SUM_UNCONDITIONAL_CONTROL=OPEN_MATH"
          echo "DNLIMIT_EQ_ZERO=false"
          echo "RH_PROVED=false"
